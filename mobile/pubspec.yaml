name: soduwork_mobile
description: "SoduWork enterprise mobile workspace"
publish_to: "none"
version: 1.13.13+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^10.3.1
  file_selector: ^1.1.0
  # Keep the document picker compatible with the project's iOS 13 target.
  file_selector_ios: 0.5.3+6
  flutter_file_dialog: ^3.3.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  flutter_markdown_plus: 1.0.12
  markdown: 7.3.1
  archive: ^4.6.0
  xml: ^6.6.1
  # Keep the XML parser compatible with the minimum Dart SDK.
  petitparser: 7.0.2
  pdfrx: 2.4.8
  open_file: 4.0.0
  path_provider: ^2.1.5
  web: ^1.1.1
  crypto: 3.0.7
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/soduwork.png
    - assets/brand/soduwork-mark.png
    - assets/shared-conversation/
    - assets/shared-conversation/pc/theme/
    - assets/shared-conversation/pc/assets/agent-brands/
    - assets/shared-conversation/pc/core/
    - assets/shared-conversation/pc/core/locales/
    - assets/shared-conversation/pc/vendor/markdown/
    - assets/shared-conversation/pc/components/requirements/
    - assets/shared-conversation/pc/components/panels/
    - assets/shared-conversation/assets/agent-brands/
    - assets/document-frame.html
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
